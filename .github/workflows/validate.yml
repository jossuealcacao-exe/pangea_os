name: Validate Pangea OS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/pangea.mjs doctor
      - run: node tools/ahp-plus/ahp.mjs verify . --strict
      - run: node scripts/generate-checksums.mjs .
      - run: git diff --exit-code -- SHA256SUMS
